<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Calculator</title>

    <link rel="stylesheet" href="./src/output.css" />

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="calculator">
      <!-- Display -->
      <div class="display">
        <div id="previous" class="previous"></div>
        <div id="display">0</div>
      </div>

      <!-- Buttons -->
      <div class="buttons">
        <button onclick="clearCalculator()" class="btn clear">AC</button>

        <button onclick="deleteNumber()" class="btn special">DEL</button>

        <button onclick="percent()" class="btn special">%</button>

        <button onclick="chooseOperator('/')" class="btn operator">÷</button>

        <button onclick="addNumber(7)" class="btn number">7</button>

        <button onclick="addNumber(8)" class="btn number">8</button>

        <button onclick="addNumber(9)" class="btn number">9</button>

        <button onclick="chooseOperator('*')" class="btn operator">×</button>

        <button onclick="addNumber(4)" class="btn number">4</button>

        <button onclick="addNumber(5)" class="btn number">5</button>

        <button onclick="addNumber(6)" class="btn number">6</button>

        <button onclick="chooseOperator('-')" class="btn operator">−</button>

        <button onclick="addNumber(1)" class="btn number">1</button>

        <button onclick="addNumber(2)" class="btn number">2</button>

        <button onclick="addNumber(3)" class="btn number">3</button>

        <button onclick="chooseOperator('+')" class="btn operator">+</button>

        <button onclick="addNumber(0)" class="btn number zero">0</button>

        <button onclick="addDot()" class="btn number">.</button>

        <button onclick="calculate()" class="btn equal">=</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
